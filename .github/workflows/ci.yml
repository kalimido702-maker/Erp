name: CI

on:
  push:
    branches: [main, develop, 'claude/*']
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd, intl, dom, xml, fileinfo
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: php-${{ matrix.php }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: php-${{ matrix.php }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure test database
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: erp_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=erp_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env
          php artisan migrate --force

      - name: Run tests
        working-directory: backend
        run: php artisan test

      - name: Generate API docs
        working-directory: backend
        run: |
          # Generate OpenAPI spec and Postman collection (non-blocking — docs failure should not fail CI)
          php artisan scribe:generate --no-interaction 2>&1 || true

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-docs
          path: |
            backend/storage/app/scribe/openapi.yaml
            backend/storage/app/scribe/collection.json
          if-no-files-found: ignore

  flutter-tests:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            frontend/.dart_tool
            ${{ env.PUB_CACHE }}
          key: flutter-pub-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: flutter-pub-

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Generate code (json_serializable / riverpod)
        working-directory: frontend
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        working-directory: frontend
        run: flutter test test/unit/ --reporter=expanded

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config --quiet
